
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  #app{font-family:'Space Grotesk',sans-serif;background:#0A0F1E;min-height:580px;display:flex;flex-direction:column;align-items:center;padding:1.5rem;border-radius:16px;color:#E8E8F0;position:relative;overflow:hidden}
  .top-bar{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
  .app-name{font-size:18px;font-weight:700;letter-spacing:.08em;color:#FF3B5C}
  .status-pill{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid #1A2040;color:#888;background:#111827;transition:all .3s}
  .status-pill.rec{border-color:#FF3B5C;color:#FF3B5C;background:#1a0510;animation:blink 1s infinite}
  .status-pill.ok{border-color:#22c55e;color:#22c55e;background:#052010}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
  .screen{width:100%;display:none;flex-direction:column;align-items:center}
  .screen.active{display:flex}

  /* HOME */
  .big-btn{width:160px;height:160px;border-radius:50%;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:transform .15s;margin:1.5rem 0 1.25rem;position:relative}
  .big-btn:active{transform:scale(.95)}
  .big-btn.idle{background:#FF3B5C;box-shadow:0 0 0 16px rgba(255,59,92,.12),0 0 0 32px rgba(255,59,92,.06)}
  .big-btn.recording{background:#FF3B5C;animation:pulse-ring 1.2s ease-out infinite}
  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(255,59,92,.5),0 0 0 0 rgba(255,59,92,.2)}100%{box-shadow:0 0 0 24px rgba(255,59,92,0),0 0 0 48px rgba(255,59,92,0)}}
  .big-btn-icon{font-size:36px;color:#fff;line-height:1}
  .big-btn-label{font-size:12px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.9);text-transform:uppercase}

  .timer{font-size:40px;font-weight:700;color:#FF3B5C;letter-spacing:.05em;margin-bottom:.5rem}
  .tap-hint{font-size:13px;color:#556;text-align:center;margin-bottom:1.25rem}
  .tap-hint strong{color:#CCD}

  .msg-box{width:100%;margin-bottom:.875rem}
  .msg-label{font-size:10px;font-weight:600;letter-spacing:.1em;color:#556;text-transform:uppercase;margin-bottom:.4rem}
  .msg-input{width:100%;background:#111827;border:1px solid #1A2040;border-radius:10px;padding:10px 12px;color:#E8E8F0;font-size:13px;font-family:inherit;resize:none;outline:none;line-height:1.6;min-height:64px}
  .msg-input:focus{border-color:#FF3B5C}
  .msg-input::placeholder{color:#334}

  .contact-section{width:100%;background:#111827;border-radius:12px;padding:.875rem 1rem;margin-bottom:.75rem;border:1px solid #1A2040}
  .section-label{font-size:10px;font-weight:600;letter-spacing:.1em;color:#556;text-transform:uppercase;margin-bottom:.625rem}
  .contact-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1A2040}
  .contact-row:last-child{border-bottom:none}
  .contact-avatar{width:28px;height:28px;border-radius:50%;background:#1A2040;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#FF3B5C;flex-shrink:0}
  .contact-name{font-size:13px;color:#CCD;flex:1}
  .contact-num{font-size:11px;color:#556}
  .contact-del{font-size:16px;color:#334;cursor:pointer;padding:0 4px;background:none;border:none;color:#556;font-family:inherit}
  .contact-del:hover{color:#FF3B5C}
  .add-contact-btn{width:100%;padding:7px;border-radius:8px;border:1px dashed #1A2040;background:transparent;color:#556;font-size:12px;cursor:pointer;margin-top:7px;font-family:inherit;transition:border-color .2s}
  .add-contact-btn:hover{border-color:#FF3B5C;color:#FF3B5C}

  /* SEND SCREEN */
  .send-title{font-size:13px;color:#556;text-align:center;margin-bottom:.875rem}
  .wa-preview{width:100%;background:#111827;border-radius:12px;padding:.875rem 1rem;border:1px solid #1A2040;margin-bottom:.75rem}
  .wa-header{display:flex;align-items:center;gap:8px;margin-bottom:.625rem}
  .wa-dot{width:7px;height:7px;border-radius:50%;background:#22c55e}
  .wa-title-label{font-size:10px;color:#556;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .wa-message{font-size:12px;color:#CCD;line-height:1.7;background:#0A0F1E;border-radius:8px;padding:8px 10px;border-left:3px solid #22c55e;white-space:pre-wrap}
  .wa-links{display:flex;flex-direction:column;gap:7px;margin-bottom:.875rem}
  .wa-link{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;background:#052010;border:1px solid #0a3020;text-decoration:none;transition:background .2s}
  .wa-link:hover{background:#073018}
  .wa-link-name{font-size:13px;color:#CCD}
  .wa-link-action{font-size:11px;color:#22c55e;font-weight:600}
  .btn-row{display:flex;gap:8px;width:100%}
  .btn{padding:11px 20px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn-ghost{background:#111827;color:#8899BB;border:1px solid #1A2040;flex:1}
  .btn-danger{background:#FF3B5C;color:#fff;flex:2}

  /* Voice bars */
  .voice-bars{display:flex;align-items:flex-end;gap:3px;height:20px;margin-bottom:4px}
  .bar{width:4px;background:#fff;border-radius:2px;animation:wave .7s ease-in-out infinite}
  .bar:nth-child(1){animation-delay:0s;height:6px}.bar:nth-child(2){animation-delay:.1s;height:13px}.bar:nth-child(3){animation-delay:.2s;height:20px}.bar:nth-child(4){animation-delay:.3s;height:13px}.bar:nth-child(5){animation-delay:.4s;height:6px}
  @keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  /* Modal */
  .modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;border-radius:16px;z-index:10}
  .modal-overlay.open{display:flex}
  .modal{background:#111827;border-radius:14px;padding:1.25rem;width:270px;border:1px solid #1A2040}
  .modal-title{font-size:15px;font-weight:700;color:#E8E8F0;margin-bottom:.875rem}
  .modal input{width:100%;background:#0A0F1E;border:1px solid #1A2040;border-radius:8px;padding:9px 10px;color:#E8E8F0;font-size:13px;font-family:inherit;margin-bottom:8px;outline:none}
  .modal input:focus{border-color:#FF3B5C}
  .modal-actions{display:flex;gap:8px;margin-top:.375rem}
  .modal-actions button{flex:1;padding:9px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none}
  .btn-cancel-m{background:#1A2040;color:#8899BB}
  .btn-add-m{background:#FF3B5C;color:#fff}

  .loc-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:20px;background:#052010;border:1px solid #0a3020;color:#22c55e;margin-bottom:1rem}
</style>

<div id="app">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden">Suraksha safety SOS app</h2>
  <div class="top-bar">
    <div class="app-name">SURAKSHA</div>
    <div class="status-pill" id="statusPill">Ready</div>
  </div>

  <!-- HOME SCREEN -->
  <div class="screen active" id="screen-home">
    <button class="big-btn idle" id="mainBtn" onclick="handleMainBtn()">
      <i class="ti ti-microphone big-btn-icon" id="mainBtnIcon" aria-hidden="true"></i>
      <span class="big-btn-label" id="mainBtnLabel">Hold to Record</span>
    </button>

    <div id="timerWrap" style="display:none">
      <div class="timer" id="timerDisplay">0:00</div>
    </div>

    <p class="tap-hint" id="tapHint"><strong>Tap once</strong> to start recording · <strong>Tap again</strong> to stop &amp; send</p>

    <div class="msg-box">
      <div class="msg-label">Quick message (optional)</div>
      <textarea class="msg-input" id="quickMsg" placeholder="e.g. I'm near Metro Pillar 42, someone is following me..." rows="2"></textarea>
    </div>

    <div class="contact-section">
      <div class="section-label">Emergency contacts</div>
      <div id="contactList"></div>
      <button class="add-contact-btn" onclick="openModal()">+ Add contact</button>
    </div>
  </div>

  <!-- SEND SCREEN -->
  <div class="screen" id="screen-send">
    <div class="send-title">Message ready — tap each contact to send on WhatsApp</div>
    <div class="loc-badge" id="locBadge"><i class="ti ti-map-pin" aria-hidden="true"></i> <span id="locText">Fetching location...</span></div>
    <div class="wa-preview">
      <div class="wa-header"><div class="wa-dot"></div><div class="wa-title-label">Message preview</div></div>
      <div class="wa-message" id="waMsg"></div>
    </div>
    <div class="wa-links" id="waLinks"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="resetApp()">Back</button>
      <button class="btn btn-danger" onclick="openAllWhatsApp()"><i class="ti ti-send" aria-hidden="true"></i> Send to all</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title">Add emergency contact</div>
      <input type="text" id="cName" placeholder="Name (e.g. Maa)" />
      <input type="tel" id="cNum" placeholder="WhatsApp number (+91...)" />
      <div class="modal-actions">
        <button class="btn-cancel-m" onclick="closeModal()">Cancel</button>
        <button class="btn-add-m" onclick="saveContact()">Add</button>
      </div>
    </div>
  </div>
</div>

<script>
let contacts = [
  { name: 'Maa', num: '+919876543210' },
  { name: 'Papa', num: '+919876543211' }
];

let recording = false;
let mediaRecorder = null;
let audioChunks = [];
let timerInterval = null;
let seconds = 0;
let currentLocation = null;
let locationFetched = false;

function renderContacts() {
  document.getElementById('contactList').innerHTML = contacts.length === 0
    ? '<div style="font-size:12px;color:#334;padding:4px 0">No contacts yet — add some below</div>'
    : contacts.map((c, i) =>
        `<div class="contact-row">
          <div class="contact-avatar">${c.name[0].toUpperCase()}</div>
          <div class="contact-name">${c.name}</div>
          <div class="contact-num">${c.num}</div>
          <button class="contact-del" onclick="removeContact(${i})">×</button>
        </div>`
      ).join('');
}

function removeContact(i) { contacts.splice(i, 1); renderContacts(); }
function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('cName').value = '';
  document.getElementById('cNum').value = '';
}
function saveContact() {
  const name = document.getElementById('cName').value.trim();
  const num = document.getElementById('cNum').value.trim();
  if (!name || !num) return;
  contacts.push({ name, num });
  renderContacts();
  closeModal();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}
function setStatus(t, cls) {
  const p = document.getElementById('statusPill');
  p.textContent = t;
  p.className = 'status-pill ' + (cls || '');
}

function fetchLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => { currentLocation = { lat: p.coords.latitude.toFixed(5), lng: p.coords.longitude.toFixed(5) }; resolve(currentLocation); },
      () => resolve(null),
      { timeout: 6000, maximumAge: 30000 }
    );
  });
}

async function handleMainBtn() {
  if (!recording) {
    if (contacts.length === 0) { alert('Add at least one emergency contact first.'); return; }
    startRecording();
  } else {
    stopAndPrepare();
  }
}

async function startRecording() {
  recording = true;
  seconds = 0;

  const btn = document.getElementById('mainBtn');
  btn.className = 'big-btn recording';
  document.getElementById('mainBtnIcon').className = 'ti ti-square-filled big-btn-icon';
  document.getElementById('mainBtnLabel').textContent = 'Tap to Send';
  document.getElementById('tapHint').innerHTML = '<strong style="color:#FF3B5C">Recording...</strong> tap the button to stop &amp; send alert';
  document.getElementById('timerWrap').style.display = 'block';
  setStatus('Recording', 'rec');

  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('timerDisplay').textContent = m + ':' + String(s).padStart(2, '0');
  }, 1000);

  fetchLocation().then(loc => {
    locationFetched = true;
  });

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
  } catch(e) {
    console.log('Mic not available:', e.message);
  }
}

async function stopAndPrepare() {
  recording = false;
  clearInterval(timerInterval);

  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();

  document.getElementById('timerWrap').style.display = 'none';
  setStatus('Ready to send', 'ok');

  if (!locationFetched) {
    currentLocation = await fetchLocation();
  }

  buildAndShowSendScreen();
}

function buildAndShowSendScreen() {
  const locUrl = currentLocation
    ? `https://maps.google.com/?q=${currentLocation.lat},${currentLocation.lng}`
    : null;

  const locLabel = currentLocation
    ? `${currentLocation.lat}, ${currentLocation.lng}`
    : 'Unavailable';

  document.getElementById('locText').textContent = locLabel;

  const quickMsg = document.getElementById('quickMsg').value.trim();

  const msg = [
    '🚨 EMERGENCY — I need help right now!',
    '',
    quickMsg ? `📝 ${quickMsg}` : '',
    locUrl ? `📍 My live location:\n${locUrl}` : '📍 Location unavailable',
    '',
    'Please call me or come immediately.'
  ].filter(l => l !== undefined).join('\n').replace(/\n{3,}/g, '\n\n').trim();

  document.getElementById('waMsg').textContent = msg;

  const encoded = encodeURIComponent(msg);
  document.getElementById('waLinks').innerHTML = contacts.map(c => {
    const num = c.num.replace(/[^0-9]/g, '');
    return `<a class="wa-link" href="https://wa.me/${num}?text=${encoded}" target="_blank">
      <span class="wa-link-name">${c.name} <span style="color:#556;font-size:11px">${c.num}</span></span>
      <span class="wa-link-action">Open WhatsApp →</span>
    </a>`;
  }).join('');

  showScreen('send');
}

function openAllWhatsApp() {
  const msg = document.getElementById('waMsg').textContent;
  const encoded = encodeURIComponent(msg);
  contacts.forEach((c, i) => {
    const num = c.num.replace(/[^0-9]/g, '');
    const url = `https://wa.me/${num}?text=${encoded}`;
    setTimeout(() => window.open(url, '_blank'), i * 600);
  });
}

function resetApp() {
  recording = false;
  mediaRecorder = null;
  audioChunks = [];
  seconds = 0;
  currentLocation = null;
  locationFetched = false;
  document.getElementById('mainBtn').className = 'big-btn idle';
  document.getElementById('mainBtnIcon').className = 'ti ti-microphone big-btn-icon';
  document.getElementById('mainBtnLabel').textContent = 'Hold to Record';
  document.getElementById('tapHint').innerHTML = '<strong>Tap once</strong> to start recording · <strong>Tap again</strong> to stop &amp; send';
  document.getElementById('timerWrap').style.display = 'none';
  document.getElementById('timerDisplay').textContent = '0:00';
  setStatus('Ready', '');
  showScreen('home');
}

renderContacts();
</script>
